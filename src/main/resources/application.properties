server.port=8080
spring.mvc.problemdetails.enabled=false

spring.datasource.hikari.pool-name=activitytrail
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

spring.flyway.locations=filesystem:db/postgres
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}

spring.kafka.consumer.group-id=${KAFKA_GROUP:activitytrail}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.listener.ack-mode=manual

activitytrail.topic=${KAFKA_TOPIC:activitytrail.field-changes}
activitytrail.dead-letter-topic=${KAFKA_DLQ_TOPIC:activitytrail.field-changes.dlq}
activitytrail.group=${KAFKA_GROUP:activitytrail}
